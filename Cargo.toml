[workspace]
resolver = "2"
# Standalone demos with their own dependencies (see each folder).
exclude = ["examples/scene-shell"]
members = [
    "crates/tpt-nova-ecs",
    "crates/tpt-nova-telemetry",
    "crates/tpt-nova-render",
    "crates/tpt-nova-input",
    "crates/tpt-nova-physics",
    "crates/tpt-nova-scene",
    "crates/tpt-nova-audio",
    "crates/tpt-nova-scripting",
    "crates/tpt-nova-gameplay-example",
    "crates/tpt-nova-ui",
    "crates/tpt-nova-editor",
    "crates/tpt-nova-anim",
    "crates/tpt-nova-ingest",
    "crates/tpt-nova-app",
    "crates/tpt-nova-neural-materials",
    "crates/tpt-nova-scripting-embedded",
    "crates/tpt-nova-splat",
    "crates/tpt-nova-rag",
    "crates/tpt-nova-export",
    "crates/tpt-nova-agent-api",
    "crates/tpt-nova-overlay",
    "crates/tpt-nova-videocap",
    "crates/tpt-nova-sample-game",
    "crates/tpt-nova-scene-graph",
    "crates/tpt-nova-drivers",
    "crates/tpt-nova-xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tpt-nova/tpt-nova"

[workspace.dependencies]
tpt-nova-ecs = { path = "crates/tpt-nova-ecs", version = "0.1.0" }
tpt-nova-telemetry = { path = "crates/tpt-nova-telemetry", version = "0.1.0" }
tpt-nova-render = { path = "crates/tpt-nova-render", version = "0.1.0" }
tpt-nova-physics = { path = "crates/tpt-nova-physics", version = "0.1.0" }
tpt-nova-scene = { path = "crates/tpt-nova-scene", version = "0.1.0" }
tpt-nova-input = { path = "crates/tpt-nova-input", version = "0.1.0" }
tpt-nova-audio = { path = "crates/tpt-nova-audio", version = "0.1.0" }
tpt-nova-ui = { path = "crates/tpt-nova-ui", version = "0.1.0" }
tpt-nova-scripting = { path = "crates/tpt-nova-scripting", version = "0.1.0" }
tpt-nova-anim = { path = "crates/tpt-nova-anim", version = "0.1.0" }
tpt-nova-ingest = { path = "crates/tpt-nova-ingest", version = "0.1.0" }
tpt-nova-neural-materials = { path = "crates/tpt-nova-neural-materials", version = "0.1.0" }
tpt-nova-scripting-embedded = { path = "crates/tpt-nova-scripting-embedded", version = "0.1.0" }
tpt-nova-splat = { path = "crates/tpt-nova-splat", version = "0.1.0" }
tpt-nova-rag = { path = "crates/tpt-nova-rag", version = "0.1.0" }
tpt-nova-export = { path = "crates/tpt-nova-export", version = "0.1.0" }
tpt-nova-agent-api = { path = "crates/tpt-nova-agent-api", version = "0.1.0" }
tpt-nova-overlay = { path = "crates/tpt-nova-overlay", version = "0.1.0" }
tpt-nova-videocap = { path = "crates/tpt-nova-videocap", version = "0.1.0" }
tpt-nova-scene-graph = { path = "crates/tpt-nova-scene-graph", version = "0.1.0" }
thiserror = "1"
arc-swap = "1"
tpt-nova-drivers = { path = "crates/tpt-nova-drivers", version = "0.1.0" }
tpt-nova-sample-game = { path = "crates/tpt-nova-sample-game", version = "0.1.0" }