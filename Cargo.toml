[workspace]
resolver = "2"
members = [
    "crates/tpt-nova-ecs",
    "crates/tpt-nova-telemetry",
    "crates/tpt-nova-render",
    "crates/tpt-nova-input",
    "crates/tpt-nova-physics",
    "crates/tpt-nova-scene",
    "crates/tpt-nova-audio",
    "crates/tpt-nova-scripting",
    "crates/tpt-nova-gameplay-example",
    "crates/tpt-nova-ui",
    "crates/tpt-nova-editor",
    "crates/tpt-nova-anim",
    "crates/tpt-nova-ingest",
    "crates/tpt-nova-app",
    "crates/tpt-nova-neural-materials",
    "crates/tpt-nova-scripting-embedded",
    "crates/tpt-nova-splat",
    "crates/tpt-nova-rag",
    "crates/tpt-nova-export",
    "crates/tpt-nova-agent-api",
    "crates/tpt-nova-overlay",
    "crates/tpt-nova-videocap",
    "crates/tpt-nova-sample-game",
    "crates/tpt-nova-xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tpt-nova/tpt-nova"

[workspace.dependencies]
tpt-nova-ecs = { path = "crates/tpt-nova-ecs" }
tpt-nova-telemetry = { path = "crates/tpt-nova-telemetry" }
tpt-nova-render = { path = "crates/tpt-nova-render" }
tpt-nova-physics = { path = "crates/tpt-nova-physics" }
tpt-nova-scene = { path = "crates/tpt-nova-scene" }
tpt-nova-input = { path = "crates/tpt-nova-input" }
tpt-nova-audio = { path = "crates/tpt-nova-audio" }
tpt-nova-ui = { path = "crates/tpt-nova-ui" }
tpt-nova-scripting = { path = "crates/tpt-nova-scripting" }
tpt-nova-anim = { path = "crates/tpt-nova-anim" }
tpt-nova-ingest = { path = "crates/tpt-nova-ingest" }
tpt-nova-neural-materials = { path = "crates/tpt-nova-neural-materials" }
tpt-nova-scripting-embedded = { path = "crates/tpt-nova-scripting-embedded" }
tpt-nova-splat = { path = "crates/tpt-nova-splat" }
tpt-nova-rag = { path = "crates/tpt-nova-rag" }
tpt-nova-export = { path = "crates/tpt-nova-export" }
tpt-nova-agent-api = { path = "crates/tpt-nova-agent-api" }
tpt-nova-overlay = { path = "crates/tpt-nova-overlay" }
tpt-nova-videocap = { path = "crates/tpt-nova-videocap" }
tpt-nova-sample-game = { path = "crates/tpt-nova-sample-game" }