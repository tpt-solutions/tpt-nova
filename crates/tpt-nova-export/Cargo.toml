[package]
name = "tpt-nova-export"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Standalone packaging + asset bundling for TPT Nova games"
readme = "README.md"
keywords = ["packaging", "asset-bundle", "archive", "game", "export"]
categories = ["game-engines", "filesystem"]

[[bin]]
name = "tpt-nova-export"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
sha2 = "0.10"
