[package]
name = "tpt-nova-ingest"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Smart mesh ingestion for TPT Nova: .glb/.obj loading, convex decomposition, procedural auto-rig, and 3D collider generation"
readme = "README.md"
keywords = ["gltf", "obj", "convex-decomposition", "rigging", "physics"]
categories = ["game-engines", "graphics"]

[dependencies]
tpt-nova-ecs = { workspace = true }
tpt-nova-anim = { workspace = true }
glam = { version = "0.29", features = ["std", "serde"] }
serde = { version = "1", features = ["derive"] }
thiserror = "1"
gltf = { version = "1", features = ["utils"] }
tobj = "4"
