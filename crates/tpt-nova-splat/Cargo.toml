[package]
name = "tpt-nova-splat"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Gaussian Splat (3DGS) loading and collision proxy generation for TPT Nova"
readme = "README.md"
keywords = ["gaussian-splatting", "3dgs", "ply", "splat", "collision"]
categories = ["graphics", "game-engines"]

[dependencies]
tpt-nova-ecs = { workspace = true }
tpt-nova-ingest = { workspace = true }
tpt-nova-overlay = { path = "../tpt-nova-overlay", version = "0.1.0" }
tpt-nova-telemetry = { workspace = true }
glam = { version = "0.29", features = ["std", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

# Optional GPU render pipeline. Kept behind a feature so the loader, data, and
# collision-proxy logic stay testable on headless CI without a GPU/display.
wgpu = { version = "30", optional = true }
bytemuck = { version = "1", optional = true }

[features]
default = []
# Enables the wgpu-backed splat render pipeline (`SplatPipeline`).
render = ["dep:wgpu", "dep:bytemuck"]

[dev-dependencies]
tpt-nova-ecs = { workspace = true }
# Headless GPU smoke test (`render` feature); skipped when no adapter exists.
pollster = "0.3"
