[package]
name = "tpt-nova-videocap"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Video-to-ECS ingestion for TPT Nova: depth map + segmentation mask -> collision proxies"
readme = "README.md"
keywords = ["depth", "segmentation", "collision", "video", "physics"]
categories = ["multimedia::video", "game-engines"]

[dependencies]
tpt-nova-ecs = { workspace = true }
tpt-nova-ingest = { workspace = true }
glam = { version = "0.29", features = ["std"] }
serde = { version = "1", features = ["derive"] }
thiserror = "1"
parry3d = "0.29"
