[package]
name = "tpt-nova-ecs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Custom Entity-Component-System core for TPT Nova"
readme = "README.md"
keywords = ["ecs", "entity-component", "scene-graph", "data-oriented", "deterministic"]
categories = ["game-engines", "data-structures"]

[dependencies]
glam = { version = "0.29", features = ["std", "serde"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
