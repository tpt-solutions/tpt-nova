[package]
name = "tpt-nova-scene-graph"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "High-level declarative 3D scene graph for TPT Nova"
readme = "README.md"
keywords = ["scene-graph", "3d", "wgpu", "game-engine", "post-processing"]
categories = ["game-engines", "graphics"]

[dependencies]
tpt-nova-ecs = { workspace = true }
# The graph is a *consumer* of the renderer: baking produces the components the
# PBR/sprite pipelines already read, and the post-process stack lowers to
# `tpt-nova-render`'s GPU chain. No wgpu code lives here.
tpt-nova-render = { workspace = true }
# Animator wrapper (Phase 10 open question): playback over the existing state machine.
tpt-nova-anim = { workspace = true }
glam = { version = "0.29", features = ["std", "serde"] }
serde = { version = "1", features = ["derive"] }
thiserror = { workspace = true }
# Optional appfront bridge: the 3D viewport contract (SceneDelegate) from tpt-appfront.
tpt-appfront-canvas-3d = { git = "https://github.com/tpt-solutions/tpt-appfront", optional = true }

[features]
appfront = ["dep:tpt-appfront-canvas-3d"]

[dev-dependencies]
tpt-window = { git = "https://github.com/tpt-solutions/tpt-window" }
