[package]
name = "tpt-nova-rag"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Local vector-DB + RAG retrieval for TPT Nova: index project assets/docs and answer context queries"
readme = "README.md"
keywords = ["rag", "vector-search", "embeddings", "retrieval", "ai"]
categories = ["algorithms", "development-tools"]

[dependencies]
tpt-nova-ecs = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[features]
default = []
# Enables `RealEmbedder`, a neural embedder that calls a local embeddings
# server (Ollama, llama.cpp `--embedding`) over plain HTTP. Adds no
# dependencies: the client is std::net plus serde_json, which is already used.
real-embeddings = []
