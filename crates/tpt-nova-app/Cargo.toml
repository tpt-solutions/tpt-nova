[package]
name = "tpt-nova-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "TPT Nova runtime application shell (tpt-window + wgpu + ECS)"
readme = "README.md"
keywords = ["tpt-window", "wgpu", "game-engine", "editor", "ecs"]
categories = ["game-engines", "graphics"]

[[bin]]
name = "tpt-nova-app"
path = "src/main.rs"

[dependencies]
tpt-nova-ecs = { workspace = true }
tpt-nova-input = { path = "../tpt-nova-input", version = "0.1.0" }
tpt-nova-render = { path = "../tpt-nova-render", version = "0.1.0", features = ["neural"] }
tpt-nova-telemetry = { path = "../tpt-nova-telemetry", version = "0.1.0" }
tpt-nova-ui = { path = "../tpt-nova-ui", version = "0.1.0" }
tpt-nova-editor = { path = "../tpt-nova-editor", version = "0.1.0" }
tpt-nova-overlay = { path = "../tpt-nova-overlay", version = "0.1.0" }
tpt-nova-neural-materials = { path = "../tpt-nova-neural-materials", version = "0.1.0" }
tpt-nova-scene = { path = "../tpt-nova-scene", version = "0.1.0" }
tpt-nova-splat = { workspace = true }

tpt-window = { git = "https://github.com/tpt-solutions/tpt-window" }
glam = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
env_logger = "0.11"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "console"] }
wasm-bindgen-futures = "0.4"
web-time = "1"
# getrandom 0.3 is pulled in through ahash (tobj -> tpt-nova-ingest); it needs the wasm_js backend.
getrandom = { version = "0.3", features = ["wasm_js"] }
