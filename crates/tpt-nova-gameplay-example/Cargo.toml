[package]
name = "tpt-nova-gameplay-example"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Example hot-reloadable gameplay module: a player-controlled 2D entity"
readme = "README.md"
keywords = ["gameplay", "hot-reload", "example", "cdylib", "game"]
categories = ["game-engines"]

# Built as a cdylib for the engine to hot-load at runtime, and as an rlib so the
# gameplay logic can be unit-tested directly in-process.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tpt-nova-ecs = { workspace = true }
tpt-nova-physics = { workspace = true }
tpt-nova-scripting = { workspace = true }
tpt-nova-input = { workspace = true }
glam = { version = "0.29", features = ["std"] }
